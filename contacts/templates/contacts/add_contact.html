<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add New Contact</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fb;
            color: #333;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #635bdb, #8178f5, #4e9de6);
            color: white;
            padding: 35px 50px;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 15px;
            opacity: 0.9;
        }

        .main {
            max-width: 850px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        .form-card h2 {
            color: #252b48;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full-width {
            grid-column: 1 / 3;
        }

        label {
            font-weight: bold;
            margin-bottom: 9px;
            color: #444;
        }

        input, textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: #635bdb;
            box-shadow: 0 0 5px rgba(99,91,219,0.2);
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        .save-btn {
            background: linear-gradient(135deg, #635bdb, #8178f5);
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .save-btn:hover {
            background: #5048c5;
            transform: translateY(-2px);
        }

        .back-btn {
            background: #e9eaff;
            color: #5048c5;
            padding: 13px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
        }

        .back-btn:hover {
            background: #dcdcff;
        }

        .required {
            color: #e74c3c;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: 1;
            }

            .header {
                padding: 25px;
            }

            .form-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>ContactHub</h1>
        <p>Add a new contact to your personal contact directory.</p>
    </div>

    <div class="main">

        <div class="form-card">

            <h2>Add New Contact</h2>

            <p class="subtitle">
                Enter the contact details below.
            </p>

            <form method="POST">

                {% csrf_token %}

                <div class="form-grid">

                    <div class="form-group">
                        <label>Full Name <span class="required">*</span></label>
                        <input
                            type="text"
                            name="full_name"
                            placeholder="Enter full name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Phone Number <span class="required">*</span></label>
                        <input
                            type="text"
                            name="phone"
                            placeholder="Enter phone number"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input
                            type="email"
                            name="email"
                            placeholder="Enter email address"
                        >
                    </div>

                    <div class="form-group">
                        <label>Company</label>
                        <input
                            type="text"
                            name="company"
                            placeholder="Enter company name"
                        >
                    </div>

                    <div class="form-group full-width">
                        <label>Address</label>
                        <textarea
                            name="address"
                            placeholder="Enter contact address"
                        ></textarea>
                    </div>

                </div>

                <div class="buttons">

                    <button type="submit" class="save-btn">
                        Save Contact
                    </button>

                    <a href="/" class="back-btn">
                        Back to Dashboard
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
